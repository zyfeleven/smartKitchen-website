# Include inside the existing HTTPS server, leaving backend and certificate routes intact.
location = /site { return 308 /mise-site/$is_args$args; }
location ~ ^/site/(.*)$ { return 308 /mise-site/$1$is_args$args; }
location = /mise-site { return 308 /mise-site/; }
location ^~ /mise-site/downloads/ {
    alias /var/www/mise-site/downloads/;
    autoindex off;
    default_type application/vnd.android.package-archive;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=86400";
}
location ^~ /mise-site/ {
    alias /var/www/mise-site/current/;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
}
